<h2 id="conceptos-b%C3%A1sicos">Conceptos básicos</h2>
<div class="div">
<ul>
<li>Impacto geológico:
<ul>
<li>Yacimientos <strong>son fijos en volumen y en calidad</strong>. Minerales son recursos no renovables.</li>
<li>Yacimientos más escasos y más profundos e innaccesibles</li>
<li>Ley del mineral: Un descenso del X% en la ley puede incrementar costos de procesamiento en un Y%.</li>
</ul>
</li>
<li>Ciclo de vida del proyecto:
<ul>
<li>La permisología toma cada vez más tiempo. <strong>Avance de la minería ilegal</strong>.</li>
<li>Fase de exploración: Costos altos por incertidumbre (ej.: USD 50-100 millones en exploración avanzada).</li>
<li>Cierre: Costos de remediación ambiental (ej.: USD 20-50 millones para una mina mediana).</li>
</ul>
</li>
<li>Escalabilidad limitada:
<ul>
<li>Dificultad para ajustar producción: Una mina no puede reducir fácilmente su escala sin afectar costos unitarios.</li>
</ul>
</li>
</ul>
</div>
<footer> <em>AMVargas</em> <em>Tecsup - Economía y costos en minería</em> <em>2025-05 (v1.0)</em></footer>
</section>

<h2 id="conceptos-b%C3%A1sicos-4">Conceptos básicos</h2>
<div class="ldiv">
<h5 id="costo-vs-gasto">Costo vs Gasto</h5>
<ul>
<li>Costo: Recursos invertidos para producir un bien (mineral).</li>
<li>Gasto: Recursos consumidos para sostener la operación, <strong>no directamente vinculados a la producción.</strong></li>
</ul>
<h5 id="costo-hundido-o-sunk-cost-en-ingl%C3%A9s">Costo hundido (o sunk cost en inglés)</h5>
<ul>
<li>Se refiere a gastos ya incurridos que no pueden recuperarse y que, por lo tanto, <strong>no deben influir en decisiones futuras de inversión o gestión</strong>.</li>
</ul>
</div>
<div class="rdiv">
<table>
<thead>
<tr>
<th style="text-align:center"><strong>Aspecto</strong></th>
<th style="text-align:center"><strong>Costo</strong></th>
<th style="text-align:center"><strong>Gasto</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center">Relación con la producción</td>
<td style="text-align:center">Directamente vinculado a la extracción y procesamiento del mineral.</td>
<td style="text-align:center">No está ligado a la producción (ej.: gastos legales, capacitación).</td>
</tr>
<tr>
<td style="text-align:center">Capitalización</td>
<td style="text-align:center">Puede capitalizarse si genera un activo (ej.: construcción de una planta).</td>
<td style="text-align:center">Se registra como gasto del período (no se capitaliza).</td>
</tr>
<tr>
<td style="text-align:center">Impacto en el estado de resultados</td>
<td style="text-align:center">Parte del COGS (Costo de Ventas) en la cuenta de resultados.</td>
<td style="text-align:center">Se registra como gasto operativo, administrativo o financiero.</td>
</tr>
</tbody>
</table>
</div>
<footer> <em>AMVargas</em> <em>Tecsup - Economía y costos en minería</em> <em>2025-05 (v1.0)</em></footer>

<h2 id="opex-vs-capex">OPEX vs CAPEX</h2>
<div class="div">
<table>
<thead>
<tr>
<th style="text-align:center"><strong>Criterio</strong></th>
<th style="text-align:center"><strong>CAPEX</strong></th>
<th style="text-align:center"><strong>OPEX</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><strong>Objetivo</strong></td>
<td style="text-align:center">Crecer, modernizar o cumplir regulaciones.</td>
<td style="text-align:center">Mantener operaciones diarias.</td>
</tr>
<tr>
<td style="text-align:center"><strong>Ejemplo típico</strong></td>
<td style="text-align:center">Compra de una flota de camiones CAEX.</td>
<td style="text-align:center">Combustible para camiones CAEX.</td>
</tr>
<tr>
<td style="text-align:center"><strong>Tratamiento contable</strong></td>
<td style="text-align:center">Capitalizado (activo) y depreciado.</td>
<td style="text-align:center">Gasto del período.</td>
</tr>
<tr>
<td style="text-align:center"><strong>Horizonte temporal</strong></td>
<td style="text-align:center">Beneficios a largo plazo (&gt;1 año).</td>
<td style="text-align:center">Beneficios inmediatos (mes a mes).</td>
</tr>
<tr>
<td style="text-align:center"><strong>Flexibilidad</strong></td>
<td style="text-align:center">Decisiones estratégicas (poco frecuentes).</td>
<td style="text-align:center">Ajustes operativos (mensual/trimestral).</td>
</tr>
<tr>
<td style="text-align:center"><strong>Impacto en liquidez</strong></td>
<td style="text-align:center">Gran desembolso inicial.</td>
<td style="text-align:center">Desembolsos recurrentes y menores.</td>
</tr>
</tbody>
</table>
<br />
<blockquote>
<p>CAPEX construye el futuro; OPEX sostiene el presente:<br />
Ya que, sin CAPEX adecuado, la mina pierde competitividad a largo plazo. Sin control de OPEX, los márgenes se erosionan incluso en proyectos bien planificados.</p>
</blockquote>
</div>
<footer> <em>AMVargas</em> <em>Tecsup - Economía y costos en minería</em> <em>2025-05 (v1.0)</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer=" *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*" data-class="fixedtitleA" data-theme="am_blue" data-heading-divider="2" lang="en-US" class="fixedtitleA" data-marpit-pagination="15" style="--paginate:true;--footer: *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*;--class:fixedtitleA;--theme:am_blue;--heading-divider:2;" data-marpit-pagination-total="145" data-size="16:9">
<h2 id="costos-fijos-vs-variables">Costos Fijos vs Variables</h2>
<div class="div">
<table>
<thead>
<tr>
<th style="text-align:center"><strong>Criterio</strong></th>
<th style="text-align:center"><strong>Costos Fijos</strong></th>
<th style="text-align:center"><strong>Costos Variables</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center">Relación con la producción</td>
<td style="text-align:center">No varían (ej.: alquiler de oficinas).</td>
<td style="text-align:center">Aumentan/disminuyen con la producción.</td>
</tr>
<tr>
<td style="text-align:center">Ejemplo típico</td>
<td style="text-align:center">Salarios de supervisores.</td>
<td style="text-align:center">Combustible para camiones CAEX.</td>
</tr>
<tr>
<td style="text-align:center">Flexibilidad</td>
<td style="text-align:center">Difícil reducir a corto plazo.</td>
<td style="text-align:center">Ajustables según necesidad operativa.</td>
</tr>
<tr>
<td style="text-align:center">Impacto en el punto de equilibrio</td>
<td style="text-align:center">Alto (deben cubrirse siempre).</td>
<td style="text-align:center">Bajo (solo se incurren si hay producción).</td>
</tr>
<tr>
<td style="text-align:center">Estructura de costos</td>
<td style="text-align:center">Mayor peso en minas de baja producción.</td>
<td style="text-align:center">Dominante en operaciones a gran escala.</td>
</tr>
<tr>
<td style="text-align:center">Impacto en liquidez</td>
<td style="text-align:center">Gran desembolso inicial.</td>
<td style="text-align:center">Desembolsos recurrentes y menores.</td>
</tr>
</tbody>
</table>
<br />
<blockquote>
<p>&quot;Los costos fijos definen el riesgo; los variables, la eficiencia&quot;:<br />
Altos costos fijos requieren producción estable y precios altos.<br />
Costos variables bajos permiten mayor flexibilidad en mercados volátiles.</p>
</blockquote>
</div>
<footer> <em>AMVargas</em> <em>Tecsup - Economía y costos en minería</em> <em>2025-05 (v1.0)</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer=" *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*" data-class="fixedtitleA" data-theme="am_blue" data-heading-divider="2" lang="en-US" class="fixedtitleA" data-marpit-pagination="16" style="--paginate:true;--footer: *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*;--class:fixedtitleA;--theme:am_blue;--heading-divider:2;" data-marpit-pagination-total="145" data-size="16:9">
<h2 id="tipos-de-costos-en-miner%C3%ADa-directos-e-indirectos">Tipos de costos en minería: directos e indirectos</h2>
<div class="div">
<ul>
<li><strong>Costos directos</strong>: Gastos que pueden asignarse específicamente a una actividad, proceso o departamento de la operación minera, <strong>vinculados directamente a la extracción, procesamiento o transporte del mineral.</strong></li>
<li>Ejemplo
<ul>
<li>Perforación y voladura:
<ul>
<li>Costos típicos: USD 1.0-2.5/ton (dependiendo de dureza de roca).</li>
<li>Optimización: Uso de software de diseño de mallas (ej.: Deswik) para reducir desviaciones.</li>
</ul>
</li>
<li>Transporte primario:
<ul>
<li>Camiones de acarreo: Costo por hora operativa (ej.: USD 200-300/hora para un camión de 300 ton).</li>
<li>Eficiencia: Reducir distancia de acarreo puede ahorrar hasta 15% en costos logísticos.</li>
</ul>
</li>
<li>Procesamiento:
<ul>
<li>Chancado y molienda: USD 0.8-1.5/ton procesada.</li>
<li>Energía en molinos SAG: Hasta el 40% del costo total de procesamiento.</li>
</ul>
</li>
</ul>
</li>
</ul>
</div>
<footer> <em>AMVargas</em> <em>Tecsup - Economía y costos en minería</em> <em>2025-05 (v1.0)</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer=" *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*" data-class="fixedtitleA" data-theme="am_blue" data-heading-divider="2" lang="en-US" class="fixedtitleA" data-marpit-pagination="17" style="--paginate:true;--footer: *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*;--class:fixedtitleA;--theme:am_blue;--heading-divider:2;" data-marpit-pagination-total="145" data-size="16:9">
<h2 id="tipos-de-costos-en-miner%C3%ADa-directos-e-indirectos-1">Tipos de costos en minería: directos e indirectos</h2>
<div class="div">
<ul>
<li><strong>Costos indirectos</strong>: Gastos necesarios para la operación minera, pero no vinculados directamente a la extracción o procesamiento del mineral. Son costos de soporte o administrativos que benefician a toda la organización.</li>
<li>Ejemplos:
<ul>
<li>Mantenimiento:
<ul>
<li>Predictivo vs. correctivo: El mantenimiento predictivo reduce costos en un 20% al evitar paradas no planificadas.</li>
</ul>
</li>
<li>Gestión ambiental:
<ul>
<li>Costos de cumplimiento: Hasta USD 10 millones/año en minas con estándares ISO 14001.</li>
<li>Multas por incumplimiento: Ejemplo: USD 12 millones en una mina por contaminación de acuíferos.</li>
</ul>
</li>
<li>Administración y permisos:
<ul>
<li>Trámites legales: Tiempo y costo para renovar concesiones (ej.: 18 meses en Perú).</li>
</ul>
</li>
</ul>
</li>
</ul>
</div>
<footer> <em>AMVargas</em> <em>Tecsup - Economía y costos en minería</em> <em>2025-05 (v1.0)</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer=" *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*" data-theme="am_blue" data-heading-divider="2" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--footer: *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*;--theme:am_blue;--heading-divider:2;" data-marpit-pagination-total="145" data-size="16:9">

<h2 id="tipos-de-costos-en-miner%C3%ADa-directos-e-indirectos-2">Tipos de costos en minería: directos e indirectos</h2>
<div class="div">
<table>
<thead>
<tr>
<th style="text-align:center"><strong>Metodología</strong></th>
<th style="text-align:center"><strong>Definición</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center">Activity-Based Costing (ABC)</td>
<td style="text-align:center">Asigna costos indirectos a actividades específicas.</td>
</tr>
<tr>
<td style="text-align:center">Costeo por Procesos</td>
<td style="text-align:center">Asigna costos a procesos continuos y homogéneos.</td>
</tr>
<tr>
<td style="text-align:center">Full Cost Accounting (FCA)</td>
<td style="text-align:center">Incluye todos los costos, incluyendo externalidades (ambientales, sociales).</td>
</tr>
<tr>
<td style="text-align:center">Lean Accounting</td>
<td style="text-align:center">Elimina desperdicios y costos que no agregan valor.</td>
</tr>
<tr>
<td style="text-align:center">Theory of Constraints (TOC)</td>
<td style="text-align:center">Identifica y optimiza el cuello de botella que limita la producción.</td>
</tr>
<tr>
<td style="text-align:center">Total Cost of Ownership (TCO)</td>
<td style="text-align:center">Evalúa todos los costos asociados a un activo durante su vida útil.</td>
</tr>
<tr>
<td style="text-align:center">Life Cycle Costing (LCC)</td>
<td style="text-align:center">Analiza costos desde exploración hasta cierre de la mina.</td>
</tr>
<tr>
<td style="text-align:center">Benchmarking de Costos</td>
<td style="text-align:center">Compara costos operativos con estándares de la industria.</td>
</tr>
<tr>
<td style="text-align:center">Value Chain Analysis (VCA)</td>
<td style="text-align:center">Examina cada actividad de la cadena para identificar fuentes de costo y valor.</td>
</tr>
</tbody>
</table>
</div>
<footer> <em>AMVargas</em> <em>Tecsup - Economía y costos en minería</em> <em>2025-05 (v1.0)</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer=" *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*" data-class="fixedtitleA" data-theme="am_blue" data-heading-divider="2" lang="en-US" class="fixedtitleA" data-marpit-pagination="20" style="--paginate:true;--footer: *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*;--class:fixedtitleA;--theme:am_blue;--heading-divider:2;" data-marpit-pagination-total="145" data-size="16:9">
<h2 id="metodologias-de-costeo">Metodologias de costeo</h2>
<div class="div">
<table>
<thead>
<tr>
<th style="text-align:center"><strong>Necesidad</strong></th>
<th style="text-align:center"><strong>Metodología recomendada</strong></th>
<th style="text-align:center"><strong>Costos Variables</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center">Asignar costos indirectos</td>
<td style="text-align:center">ABC, TDABC, Costeo por Procesos.</td>
<td style="text-align:center">Aumentan/disminuyen con la producción.</td>
</tr>
<tr>
<td style="text-align:center">Optimizar eficiencia</td>
<td style="text-align:center">Lean Accounting, TOC, Benchmarking.</td>
<td style="text-align:center">Combustible para camiones CAEX.</td>
</tr>
<tr>
<td style="text-align:center">Gestión ambiental</td>
<td style="text-align:center">Full Cost Accounting, EMA.</td>
<td style="text-align:center">Ajustables según necesidad operativa.</td>
</tr>
<tr>
<td style="text-align:center">Decisiones de inversión</td>
<td style="text-align:center">TCO, Life Cycle Costing.</td>
<td style="text-align:center">Bajo (solo se incurren si hay producción).</td>
</tr>
<tr>
<td style="text-align:center">Control presupuestario</td>
<td style="text-align:center">Costeo Estándar, Data-Driven Costing.</td>
<td style="text-align:center">Dominante en operaciones a gran escala.</td>
</tr>
<tr>
<td style="text-align:center">Impacto en liquidez</td>
<td style="text-align:center">Gran desembolso inicial.</td>
<td style="text-align:center">Desembolsos recurrentes y menores.</td>
</tr>
</tbody>
</table>
<br />
<blockquote>
<p>Consecuencias de una mala asignación</p>
<ul>
<li>Toma de decisiones erróneas: Proyectos que parecen rentables, pero no lo son.</li>
<li>Pérdida de competitividad: Costos mal asignados generan precios no realistas.</li>
</ul>
</blockquote>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-eqG4c5NZ="" data-paginate="true" data-footer=" *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*" data-class="fixedtitleA" data-theme="am_blue" data-heading-divider="2" lang="en-US" class="fixedtitleA" data-marpit-pagination="21" style="--paginate:true;--footer: *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*;--class:fixedtitleA;--theme:am_blue;--heading-divider:2;" data-marpit-pagination-total="145" data-size="16:9">
<h2 id="%C2%BFpor-qu%C3%A9-es-importante-gestionar-los-costos">¿Por qué es importante gestionar los costos?</h2>
<div class="div">
<ul>
<li><strong>Rentabilidad y Viabilidad Financiera.</strong><br />
La minería requiere <em>grandes sumas de dinero</em> (exploración, equipos, mano de obra, permisos). Controlar costos asegura ganancias, incluso con fluctuaciones en los precios de los minerales.</li>
<li><strong>Competitividad en el Mercado</strong><br />
Costos bajos permiten competir mejor, especialmente cuando los precios globales caen.</li>
<li><strong>Optimización de Recursos</strong><br />
Reduce desperdicios (insumos, materiales, energía, tiempo) y maximiza la eficiencia operativa.</li>
<li><strong>Reducción de Riesgos</strong><br />
Evita sobrecostos durante la operación. Así también, retrasos o cierres anticipados de minas.</li>
<li><strong>Confianza de Inversores</strong><br />
Atrae financiamiento al demostrar eficiencia financiera.</li>
<li><strong>Permite diseñar planes estratégicos robustos</strong><br />
Ante los diversos escenarios que se enfrenta la minería, el control de costos es clave.</li>
</ul>
</div>
<footer> <em>AMVargas</em> <em>Tecsup - Economía y costos en minería</em> <em>2025-05 (v1.0)</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-nS9wvj2K="" data-paginate="true" data-footer=" *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*" data-class="fixedtitleA" data-theme="am_blue" data-heading-divider="2" lang="en-US" class="fixedtitleA" data-marpit-pagination="22" style="--paginate:true;--footer: *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*;--class:fixedtitleA;--theme:am_blue;--heading-divider:2;" data-marpit-pagination-total="145" data-size="16:9">
<h2 id="puntos-clave-en-la-gesti%C3%B3n-de-costos">Puntos clave en la gestión de costos</h2>
<div class="div">
<ul>
<li><strong>Objetivo Único</strong>: Maximizar el Valor para el Accionista (NPV)</li>
</ul>
<blockquote>
<p>Muchas veces se apunta a diversos objetivos. Por eso es importante identificar los escenarios donde estos objetivos aplican y se llevan a cabo</p>
</blockquote>
<p><img src="./img/ShareHolder_obj.png" alt="center" style="height:350px;" /></p>
</div>

<h2 id="puntos-clave-en-la-gesti%C3%B3n-de-costos-1">Puntos clave en la gestión de costos</h2>
<div class="ldiv">
<h4 id="priorizaci%C3%B3n-de-decisiones-de-capital">Priorización de decisiones de capital</h4>
<ul>
<li>En general, las decisiones de gasto de capital (CapEx) tienen mucho más impacto que los costos operativos (OpEx).</li>
<li>Se deben priorizar aquellas que afectan directamente al valor del proyecto.</li>
<li>Impacto de las cuentas por pagar y la rotación de inventarios.</li>
</ul>
</div>
<div class="rdiv">
<h4 id="equipos-multidisciplinarios">Equipos multidisciplinarios</h4>
<ul>
<li>Evaluar cambios considerables en el plan estratégico, por consiguiente, en la producción requiere del involucramiento de personal de operaciones, logísticas, marketing, finanzas.</li>
<li>Si bien no es posible proporcionar todos los casos a todos, los más importantes deberían revisarse con mayor profundidad para detectar errores, lograr una mayor implicación del equipo y descubrir nuevas ideas para optimizar el valor del proyecto.</li>
</ul>
</div>
<footer> <em>AMVargas</em> <em>Tecsup - Economía y costos en minería</em> <em>2025-05 (v1.0)</em></footer>
</section>

<h2 id="puntos-clave-en-la-gesti%C3%B3n-de-costos-2">Puntos clave en la gestión de costos</h2>
<div class="ldiv">
<h4 id="optimizaci%C3%B3n-de-pol%C3%ADticas-de-minado-y-procesamiento">Optimización de políticas de minado y procesamiento</h4>
<ul>
<li>Evitar decisiones aisladas como aumentar procesamiento sin ajustar secuencias de minado. <strong>La revisión integral es vital</strong></li>
</ul>
<h4 id="iteraci%C3%B3n-en-la-revisi%C3%B3n-de-planes">Iteración en la revisión de planes</h4>
<ul>
<li>La información más fidedigna es la del personal que se encuentra en campo. Este es un input valioso para la toma de decisiones.<br />
Se recomienda revisión independiente para validar resultados y evitar sesgos.</li>
</ul>
</div>

<h2 id="herramientas-para-la-gesti%C3%B3n-de-costos">Herramientas para la gestión de costos</h2>
<div class="div">
<h5 id="el-uso-de-erps-en-miner%C3%ADa">El uso de ERPs en minería</h5>
<ul>
<li>Un ERP permite integrar los datos correspondientes a los procesos que componen una industria, en este caso: minera. Permite, entre otras cosas:
<ul>
<li>Controlar costos</li>
<li>Cumplimiento normativo → Muchas corporaciones adoptan este estándar.</li>
<li>Optimizar procesos</li>
<li>Integraciones con IA</li>
<li>Escalabilidad → Cuanto más crece la empresa, se adapta mejor.</li>
</ul>
</li>
</ul>
<blockquote>
<p>El grado de adaptabilidad es limitado. Entonces SAP ¿amigo o enemigo?</p>
</blockquote>
</div>

<h2 id="ciclo-de-trabajo-minero">Ciclo de Trabajo minero</h2>
<div class="ldiv">
<h4 id="flujo-de-trabajo-t%C3%ADpico-minero">Flujo de trabajo Típico minero</h4>
<p>Este ciclo regular de actividades se compone en perforación, voladura, carguio y acarreo de materiales provenientes del tajo. Este mismo principio es el mismo sin importar si es <strong>mineria cielo abierto</strong> o <strong>mineria subterránea</strong>.<br />
Sin embargo, el costeo suele ser diferente a partir de las diferencias que existen en los tipos de minado.</p>
</div>
<div class="rimg">
<p><img src="./img/MineCycle.png" alt="#c" style="height:400px;" /></p>
</div>
<footer> <em>AMVargas</em> <em>Tecsup - Economía y costos en minería</em> <em>2025-05 (v1.0)</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-footer=" *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*" data-class="pin-3" data-theme="am_blue" data-heading-divider="2" lang="en-US" class="pin-3" data-marpit-pagination="60" style="--paginate:true;--footer: *AMVargas* *Tecsup - Economía y costos en minería* *2025-05 (v1.0)*;--class:pin-3;--theme:am_blue;--heading-divider:2;" data-marpit-pagination-total="145" data-size="16:9">
<h2 id="perforaci%C3%B3n-de-taladros">Perforación de taladros</h2>
<div class="tdiv">
<p>La perforación es el proceso mediante el cual se realizan taladros en la roca con el objetivo de colocar explosivos que permitan fragmentarla para su posterior carga y transporte. Este proceso es una etapa crítica dentro del ciclo de minado, ya que determina la eficiencia de la voladura, el tamaño del material fragmentado y, por lo tanto, la productividad general de la operación minera.</p>
</div>
<div class="limg">
<p><img src="./img/Raptor.png" alt="#c" style="height:350px;" /></p>
</div> 
<div class="rimg">
<p><img src="img/perfo.png" alt="#c" style="height:350px;" /></p>
</div> 
<footer> <em>AMVargas</em> <em>Tecsup - Economía y costos en minería</em> <em>2025-05 (v1.0)</em></footer>
</section>

<h2 id="perforaci%C3%B3n-de-taladros-1">Perforación de taladros</h2>
<div class="div">
<table>
<thead>
<tr>
<th style="text-align:center"><strong>Característica</strong></th>
<th style="text-align:center"><strong>Minería <br /> Superficial</strong></th>
<th style="text-align:center"><strong>Minería <br /> Subterránea</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><strong>Objetivo Principal</strong></td>
<td style="text-align:center">Fragmentar grandes volúmenes de roca</td>
<td style="text-align:center">Fragmentar zonas selectivas o vetas</td>
</tr>
<tr>
<td style="text-align:center"><strong>Tipo de equipos</strong></td>
<td style="text-align:center">Perforadoras rotativas o de martillo en fondo</td>
<td style="text-align:center">Jumbos, martillos neumáticos o hidráulicos</td>
</tr>
<tr>
<td style="text-align:center"><strong>Acceso al frente de trabajo</strong></td>
<td style="text-align:center">Fácil, al aire libre</td>
<td style="text-align:center">Limitado, por túneles y galerías estrechas</td>
</tr>
<tr>
<td style="text-align:center"><strong>Diámetro de los barrenos</strong></td>
<td style="text-align:center">Grandes (100–400 mm)</td>
<td style="text-align:center">Pequeños a medianos (33–76 mm)</td>
</tr>
<tr>
<td style="text-align:center"><strong>Profundidad de perforación</strong></td>
<td style="text-align:center">Alta (hasta 20–40 m o más por banco)</td>
<td style="text-align:center">Moderada (1.5–5 m o más según método)</td>
</tr>
<tr>
<td style="text-align:center"><strong>Condiciones de trabajo</strong></td>
<td style="text-align:center">Mejor ventilación e iluminación natural</td>
<td style="text-align:center">Condiciones restringidas, necesidad de ventilación</td>
</tr>
<tr>
<td style="text-align:center"><strong>Riesgos operativos</strong></td>
<td style="text-align:center">Desprendimientos, polvo</td>
<td style="text-align:center">Colapsos, gases, falta de visibilidad</td>
</tr>
<tr>
<td style="text-align:center"><strong>Tasa de avance</strong></td>
<td style="text-align:center">Alta (mayor volumen por ciclo)</td>
<td style="text-align:center">Menor (operación más precisa y controlada)</td>
</tr>
<tr>
<td style="text-align:center"><strong>Costo por metro perforado</strong></td>
<td style="text-align:center">Relativamente bajo</td>
<td style="text-align:center">Más alto debido a complejidad y accesibilidad</td>
</tr>
<tr>
<td style="text-align:center"><strong>Flexibilidad de diseño</strong></td>
<td style="text-align:center">Alta, permite rediseñar con más libertad</td>
<td style="text-align:center">Limitada por la geometría subterránea</td>
</tr>

<h2 id="voladura-de-rocas">Voladura de Rocas</h2>
<p>La voladura es el proceso mediante el cual se fractura y fragmenta la roca utilizando explosivos colocados previamente en taladros perforados. El objetivo principal de la voladura es liberar el material útil (mineral o estéril) para facilitar su carga, transporte y procesamiento, optimizando además los costos y la eficiencia operativa del minado.</p>
<p><img src="img/Blasting.png" alt="#c" style="height:360px;" /></p>

<h2 id="cargu%C3%ADo---en-mina-tajo-abierto">Carguío - en Mina Tajo Abierto</h2>
<p>Proceso mediante el cual el material fragmentado (mineral o estéril) es <strong>recogido del frente de trabajo y depositado en un equipo de transporte o almacenamiento intermedio</strong>. Esta etapa clave en el ciclo de minado, ya que determina la <strong>eficiencia del acarreo y la continuidad de la producción</strong>.</p>

<h2 id="mantenimiento-de-equipos-mineros---modelo-de-tiempos">Mantenimiento de Equipos Mineros - Modelo de tiempos</h2>
<table>
<thead>
<tr>
<th><strong>Componente del Tiempo</strong></th>
<th><strong>Símbolo</strong></th>
<th><strong>Descripción</strong></th>
<th><strong>Ejemplo (min/día)</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td>Tiempo disponible</td>
<td>T_disp</td>
<td>Total tiempo calendario disponible</td>
<td>1,440 min</td>
</tr>
<tr>
<td>Tiempo de operación</td>
<td>T_op</td>
<td>Tiempo efectivo que el equipo trabaja</td>
<td>1,000 min</td>
</tr>
<tr>
<td>Tiempo de detención programada</td>
<td>T_prog</td>
<td>Mantenimiento preventivo, repostaje, cambio turno</td>
<td>300 min</td>
</tr>
<tr>
<td>Tiempo de detención no programada</td>
<td>T_np</td>
<td>Fallas imprevistas, condiciones climáticas</td>
<td>100 min</td>
</tr>
<tr>
<td><strong>Utilización</strong></td>
<td>U = T_op / T_disp</td>
<td>Porcentaje del tiempo usado efectivamente</td>
<td>69.4%</td>
</tr>
<tr>
<td><strong>Disponibilidad mecánica</strong></td>
<td>D = (T_disp - T_np) / T_disp</td>
<td>Capacidad del equipo sin fallas</td>
<td>93.1%</td>
</tr>
<tr>
<td><strong>Eficiencia operativa</strong></td>
<td>E = T_op / (T_disp - T_prog)</td>
<td>Eficiencia sin considerar detenciones programadas</td>
<td>83.3%</td>
</tr>
</tbody>
</table>

<td>5</td>

</tr>

<div class="div">
<blockquote>
<p>There is something very wrong with [the] conventional model of decision-making ... it conceives of decision-making as a process of selecting from existing options according to a fixed formula ... But in fact that is what happens only at the end of decision making – the phase that does not require creative thought ... At the heart of decision-making is the creation of new options and the abandonment or modification of existing ones (Deutsch, 2011, p 341).​</p>
</blockquote>
</div>

<h2 id="limitaciones-del-dcf">Limitaciones del DCF</h2>

<ul>
<li>No permite aplicar adecuadamente factores de descuento apropiados para ajustar por el riesgo.</li>
<li>Problemas con el uso del WACC corporativo</li>
<li>Problemas con la TIR, Payback y otras medidas</li>
<li>Volatilidad de los precios de los productos mineros</li>
<li>Riesgo geológico</li>
</ul>
</li>
<li>
<p>No permite valorizar correctamente proyectos mineros de larga duración (o sea casi todos)</p>
</li>
</ul>
</div>

<h2 id="weighted-average-cost-of-capital---wacc">Weighted Average Cost of Capital - WACC</h2>
<div class="div">
<ul>
<li>El flujo de caja necesita ser descontado por una tasa de descuento apropiada. Para ello, se hará uso de la teoría de mercado de capitales.</li>
<li>La tasa de descuento puede ser vista como el valor alcanzable necesario para lograr cumplir las expectativas mínimas del mercado para los activos listados. Si un VAN positivo es logrado a una determinada tasa de descuento, entonces el valor adicional será añadido a la compañía.</li>
<li>El costo de capital es la tasa de retorno aceptada que puede realizarse en una alternativa de inversión similar de riesgo equivalente.</li>
<li>En la práctica común, los términos “costo de capital”, “tasa de retorno”, “tasa de descuento”, “costo de oportunidad de capital” son usados de forma intercambiable. Sin embargo, no deben confundirse con “costo financiero de capital” el cual esta relacionado al costo del dinero que ha sido dado por bonos, créditos, acciones comunes, entre otros.</li>
</ul>
</div>
<footer> <em>AMVargas</em> <em>Tecsup - Economía y costos en minería</em> <em>2025-05 (v1.0)</em></footer>

<h2 id="an%C3%A1lisis-de-rentabilidad-y-margen-en-la-industria-minera">Análisis de rentabilidad y margen en la industria minera</h2>
<div class="div">
<h5 id="%C2%BFpor-qu%C3%A9-es-importante">¿Por qué es importante?</h5>
<ul>
<li><strong>Indicador de sostenibilidad:</strong> Las operaciones con bajo margen difícilmente pueden sostener inversiones en seguridad, medio ambiente o desarrollo comunitario.</li>
<li><strong>Atracción de capital:</strong> Inversionistas priorizan operaciones con rendimientos consistentes y predecibles.</li>
<li><strong>Base para decisiones estratégicas:</strong> Proyectos no rentables en términos ajustados al riesgo deberían ser descartados desde el inicio.</li>
</ul>
<h5 id="%C2%BFc%C3%B3mo-se-aplica-en-la-pr%C3%A1ctica">¿Cómo se aplica en la práctica?</h5>
<ol>
<li><strong>Formulación de estrategia:</strong> Un marco estratégico claro permite definir metas de retorno y márgenes deseados.</li>
</ol>
</div>
<footer> <em>AMVargas</em> <em>Tecsup - Economía y costos en minería</em> <em>2025-05 (v1.0)</em></footer>

<h2 id="an%C3%A1lisis-de-rentabilidad-y-margen-en-la-industria-minera-1">Análisis de rentabilidad y margen en la industria minera</h2>
<div class="div">
<h5 id="%C2%BFc%C3%B3mo-se-aplica-en-la-pr%C3%A1ctica-1">¿Cómo se aplica en la práctica?</h5>
<ol start="2">
<li><strong>Optimización del portafolio:</strong> Mineras líderes priorizan activos con retorno sobre el capital invertido (ROIC) superior al costo de capital.</li>
<li><strong>Alineación operativa:</strong> Las métricas de rentabilidad se traducen en planes tácticos y KPIs por unidad operativa.</li>
</ol>
<h5 id="principios-y-mejores-pr%C3%A1cticas">Principios y mejores prácticas</h5>
<table>
<thead>
<tr>
<th>Principio Gerencial</th>
<th>Aplicación en Minería</th>
</tr>
</thead>
<tbody>
<tr>
<td>ROIC sobre WACC</td>
<td>Asegura que se crea valor económico real.</td>
</tr>
<tr>
<td>NPV positivo y robusto ante sensibilidad</td>
<td>Garantiza resiliencia ante volatilidad de precios.</td>
</tr>
<tr>
<td>Margen operativo &gt; 30%</td>
<td>Suele indicar eficiencia operativa y resiliencia.</td>
</tr>
<tr>
<td>Costos All-in Sustaining Costs (AISC)</td>
<td>Comparación estándar entre pares.</td>
</tr>
</tbody>
</table>
</div>
